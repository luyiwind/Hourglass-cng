# .github/workflows/deploy.yml
name: Reset History and Deploy to Cloudflare Pages

on:
  push:
    branches: [release]
    paths:
      - '**.json'
      - '**.js'
      - '**.css'
      - '**.html'
      - 'images/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 第1步：清理历史
  reset-history:
    runs-on: ubuntu-latest
    if: github.event.head_commit.message != 'Initial commit'
    
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref_name }}
          fetch-depth: 2
      
      - name: Reset history
        id: reset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BRANCH=${{ github.ref_name }}
          
          # 记录当前 commit hash，用于后续步骤
          echo "reset_commit=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          
          git checkout --orphan temp_branch
          git add -A
          git commit -m "Initial commit"
          
          git branch -D $BRANCH 2>/dev/null || true
          git branch -m $BRANCH
          
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin $BRANCH
          
          echo "History reset completed"

  # 第2步：部署到 Cloudflare（等 reset 完成）
  deploy-cf:
    runs-on: ubuntu-latest
    needs: reset-history  # 关键：依赖 reset-history
    
    steps:
      - name: Checkout resetted code
        uses: actions/checkout@v4
        with:
          ref: release      # 拉取 reset 后的最新代码
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        run: |
          wrangler pages deploy . \
            --project-name=hourglass-cng \
            --branch=release \
            --commit-hash=${{ github.sha }} \
            --commit-message="${{ github.event.head_commit.message }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
